<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>everfly</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/static/images/logo.png">
    <!-- Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const CURRENT_USER = {{ user| tojson | safe }};
        const CSRF_TOKEN = "{{ csrf_token() }}";
    </script>
    <link rel="stylesheet" href="/static/css/style.css?v=table5">
</head>

<body>

    <!-- Header / Toolbar -->
    <header class="navbar">
        <div class="navbar-left">
            <a href="#" class="navbar-brand" onclick="navigateTo('profile'); return false;">
                <img src="/static/images/logo.png" alt="everfly Logo" height="32">
                everfly
            </a>
        </div>
        <div class="navbar-right">
            <div class="nav-item active" onclick="navigateTo('profile')">Profile</div>
            <div class="nav-item" onclick="navigateTo('flights')">Flights</div>
            <button class="btn btn-primary" onclick="openAddFlightModal()">
                <i class="fa-solid fa-plus"></i> Add flight
            </button>
            <div class="user-info" onclick="openEditProfileModal(); toggleDropdown();" title="Edit Profile">
                <div class="user-avatar-circle">
                    <span id="user-avatar-initial"></span>
                </div>
                <span id="user-display-name" class="user-display-name"></span>
            </div>

            <div class="dropdown" id="settings-dropdown">
                <button class="btn btn-secondary dropdown-toggle" onclick="toggleDropdown()">
                    <i class="fa-solid fa-gear"></i> Setting <i class="fa-solid fa-caret-down"></i>
                </button>
                <div class="dropdown-content">
                    <button onclick="navigateTo('datasets'); toggleDropdown();">
                        <i class="fa-solid fa-database"></i> Other Datasets
                    </button>
                    <button onclick="openEditProfileModal(); toggleDropdown();">
                        <i class="fa-solid fa-user-edit"></i> Edit Profile
                    </button>
                    <a href="/logout">
                        <i class="fa-solid fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container">
        <!-- Views will be injected here -->

        <!-- Profile View -->
        <section id="view-profile" class="view active">
            <!-- User Profile Card -->
            <!-- User Card moved to Header Stats -->

            <div class="map-container">
                <div id="flight-map"></div>
                <div class="map-controls">
                    <select id="year-filter" style="padding: 5px; margin-right: 5px;">
                        <option value="all">All Years</option>
                    </select>
                    <button onclick="setMapLayer('map')">Map</button>
                    <button onclick="setMapLayer('satellite')">Satellite</button>
                </div>
            </div>
            <!-- Stats Dashboard will be injected here -->
            <div id="profile-stats-dashboard" class="stats-container"></div>
        </section>

        <!-- Flights View -->
        <section id="view-flights" class="view" style="display: none;">
            <div class="container">
                <div class="view-header flights-header">
                    <h2>Flight History</h2>
                    <div class="view-actions flights-actions">
                        <button class="btn btn-sm btn-secondary" onclick="openImportFlightsModal()">
                            <i class="fa-solid fa-file-upload"></i> Import CSV
                        </button>
                        <button class="btn btn-sm btn-secondary" onclick="updateMissingFlights()"
                            title="Update missing info from AeroAPI" disabled
                            style="opacity: 0.5; cursor: not-allowed;">
                            <i class="fa-solid fa-cloud-download-alt"></i> Update Missing
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="flight-table" id="flights-table">
                        <thead>
                            <tr>
                                <th onclick="sortFlights('date')" style="cursor:pointer">Date / Flight <i
                                        class="fas fa-sort"></i></th>
                                <th onclick="sortFlights('std')" style="cursor:pointer">Times <i
                                        class="fas fa-sort"></i></th>
                                <th onclick="sortFlights('origin_name')" style="cursor:pointer">From <i
                                        class="fas fa-sort"></i></th>
                                <th onclick="sortFlights('dest_name')" style="cursor:pointer">To <i
                                        class="fas fa-sort"></i></th>
                                <th onclick="sortFlights('distance')" style="cursor:pointer">Dist / Dur <i
                                        class="fas fa-sort"></i></th>
                                <th onclick="sortFlights('airline_name')" style="cursor:pointer">Airline <i
                                        class="fas fa-sort"></i></th>
                                <th onclick="sortFlights('aircraft_model')" style="cursor:pointer">Aircraft / Reg <i
                                        class="fas fa-sort"></i></th>
                                <th onclick="sortFlights('seat_number')" style="cursor:pointer">Seat / Class <i
                                        class="fas fa-sort"></i></th>
                                <th>Note</th>
                                <th>Actions</th>
                            </tr>
                            <tr class="filter-row">
                                <th><input type="text" onkeyup="filterFlights()" placeholder="Date / No.">
                                </th>
                                <th></th>
                                <th><input type="text" onkeyup="filterFlights()" placeholder="From">
                                </th>
                                <th><input type="text" onkeyup="filterFlights()" placeholder="To"></th>
                                <th></th>
                                <th><input type="text" onkeyup="filterFlights()" placeholder="Airline"></th>
                                <th><input type="text" onkeyup="filterFlights()" placeholder="Aircraft / Reg"></th>
                                <th><input type="text" onkeyup="filterFlights()" placeholder="Seat / Class">
                                </th>
                                <th><input type="text" onkeyup="filterFlights()" placeholder="Note"></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Flights rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Datasets View -->
        <section id="view-datasets" class="view" style="display: none;">
            <div class="container">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchDatasetTab('cities')">Cities</button>
                    <button class="tab-btn" onclick="switchDatasetTab('airports')">Airports</button>
                    <button class="tab-btn" onclick="switchDatasetTab('airlines')">Airlines</button>
                    <button class="tab-btn" onclick="switchDatasetTab('aircraft')">Aircraft</button>
                </div>

                <div class="dataset-content">
                    <div class="toolbar"
                        style="margin-bottom: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between;">
                        <div style="display:flex; gap:10px;">
                            <button class="btn btn-sm btn-secondary" onclick="openAddDatasetModal()">Add New</button>
                            <button class="btn btn-sm btn-secondary" onclick="openImportModal()">
                                <i class="fa-solid fa-file-upload"></i> Import CSV
                            </button>
                            <button class="btn btn-sm btn-secondary"
                                style="color: var(--danger); border-color: var(--danger);"
                                onclick="clearCurrentDataset()">
                                <i class="fa-solid fa-trash-can"></i> Clear
                            </button>
                            <div id="dataset-dynamic-actions" style="display:inline-block;"></div>
                        </div>
                        <div class="search-box">
                            <input type="text" id="dataset-search" placeholder="Filter..." onkeyup="filterDataset()"
                                style="padding: 5px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                    </div>
                    <table class="data-table" id="dataset-table">
                        <!-- Dynamic columns and rows -->
                    </table>
                </div>
            </div>
        </section>

    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile primary navigation">
        <button class="mobile-nav-item active" data-mobile-view="profile" onclick="navigateTo('profile')">
            <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
            <span>Profile</span>
        </button>
        <button class="mobile-nav-item" data-mobile-view="flights" onclick="navigateTo('flights')">
            <i class="fa-solid fa-plane-departure" aria-hidden="true"></i>
            <span>Flights</span>
        </button>
        <button class="mobile-nav-item mobile-nav-primary" onclick="openAddFlightModal()">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            <span>Add</span>
        </button>
        <button class="mobile-nav-item" data-mobile-view="datasets" onclick="navigateTo('datasets')">
            <i class="fa-solid fa-database" aria-hidden="true"></i>
            <span>Data</span>
        </button>
    </nav>

    <!-- Modals -->
    <div id="modal-container" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Title</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic Form -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-text" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v=table5"></script>
</body>

</html>
